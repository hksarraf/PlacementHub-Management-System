<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PlacementHub - Create Account</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .signup-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background:
                radial-gradient(circle at 15% 20%, rgba(79, 70, 229, 0.12), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.10), transparent 30%),
                #f8fafc;
        }

        .signup-card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 22px;
            padding: 38px 36px;
            box-shadow:
                0 20px 45px rgba(15, 23, 42, 0.08),
                0 4px 12px rgba(15, 23, 42, 0.04);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 14px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #ffffff;
            font-size: 25px;
            font-weight: 800;
            box-shadow: 0 10px 22px rgba(79, 70, 229, 0.25);
        }

        .brand h1 {
            margin: 0;
            color: #111827;
            font-size: 25px;
            font-weight: 750;
            letter-spacing: -0.5px;
        }

        .brand p {
            margin: 6px 0 0;
            color: #6b7280;
            font-size: 13px;
        }

        .signup-header {
            margin-bottom: 23px;
        }

        .signup-header h2 {
            margin: 0 0 7px;
            color: #111827;
            font-size: 22px;
            font-weight: 700;
        }

        .signup-header p {
            margin: 0;
            color: #6b7280;
            font-size: 13.5px;
        }

        .input-group {
            margin-bottom: 17px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-size: 13px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid #dfe3e8;
            border-radius: 10px;
            background: #ffffff;
            color: #111827;
            font-size: 14px;
            outline: none;
            transition: 0.2s ease;
            box-sizing: border-box;
        }

        .input-group input::placeholder {
            color: #9ca3af;
        }

        .input-group input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.10);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 48px;
        }

        .password-box button {
            position: absolute;
            right: 7px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #6b7280;
            cursor: pointer;
            font-size: 16px;
        }

        .password-box button:hover {
            background: #f3f4f6;
        }

        .signup-btn {
            width: 100%;
            height: 47px;
            margin-top: 5px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #ffffff;
            font-size: 14px;
            font-weight: 650;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(79, 70, 229, 0.20);
            transition: 0.2s ease;
        }

        .signup-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 11px 22px rgba(79, 70, 229, 0.26);
        }

        .signup-btn:active {
            transform: translateY(0);
        }

        #signupMessage {
            min-height: 18px;
            margin: 12px 0 0;
            text-align: center;
            font-size: 12.5px;
        }

        .login-text {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eef0f3;
            text-align: center;
            color: #6b7280;
            font-size: 12.5px;
        }

        .login-text a {
            margin-left: 4px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {

            .signup-container {
                padding: 20px 14px;
            }

            .signup-card {
                padding: 30px 24px;
                border-radius: 18px;
            }

            .brand h1 {
                font-size: 23px;
            }

            .signup-header h2 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <div class="signup-card">

            <div class="brand">

                <div class="brand-icon">
                    P
                </div>

                <h1>PlacementHub</h1>

                <p>Student Placement Management</p>

            </div>

            <div class="signup-header">

                <h2>Create Account</h2>

                <p>
                    Create your student account to get started
                </p>

            </div>

            <form id="signupForm">

                <div class="input-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                        >
                            👁
                        </button>

                    </div>

                </div>

                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                        <button
                            type="button"
                            id="toggleConfirmPassword"
                        >
                            👁
                        </button>

                    </div>

                </div>

                <button
                    type="submit"
                    class="signup-btn"
                >
                    Create Account
                </button>

                <p id="signupMessage"></p>

            </form>

            <div class="login-text">

                Already have an account?

                <a href="index.html">
                    Login
                </a>

            </div>

        </div>

    </div>

    <script>

        const signupForm =
            document.getElementById("signupForm");

        const passwordInput =
            document.getElementById("password");

        const confirmPasswordInput =
            document.getElementById("confirmPassword");

        const togglePassword =
            document.getElementById("togglePassword");

        const toggleConfirmPassword =
            document.getElementById("toggleConfirmPassword");

        const signupMessage =
            document.getElementById("signupMessage");


        /* ================================
           SHOW / HIDE PASSWORD
        ================================ */

        togglePassword.addEventListener(
            "click",
            function () {

                if (passwordInput.type === "password") {

                    passwordInput.type = "text";
                    togglePassword.textContent = "🙈";

                } else {

                    passwordInput.type = "password";
                    togglePassword.textContent = "👁";

                }

            }
        );


        toggleConfirmPassword.addEventListener(
            "click",
            function () {

                if (confirmPasswordInput.type === "password") {

                    confirmPasswordInput.type = "text";
                    toggleConfirmPassword.textContent = "🙈";

                } else {

                    confirmPasswordInput.type = "password";
                    toggleConfirmPassword.textContent = "👁";

                }

            }
        );


        /* ================================
           SIGNUP
        ================================ */

        signupForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                const name =
                    document.getElementById("name")
                    .value
                    .trim();

                const email =
                    document.getElementById("email")
                    .value
                    .trim();

                const password =
                    passwordInput.value;

                const confirmPassword =
                    confirmPasswordInput.value;


                signupMessage.textContent = "";
                signupMessage.style.color = "#dc2626";


                if (
                    name === "" ||
                    email === "" ||
                    password === "" ||
                    confirmPassword === ""
                ) {

                    signupMessage.textContent =
                        "Please fill all fields.";

                    return;

                }


                if (password.length < 6) {

                    signupMessage.textContent =
                        "Password must contain at least 6 characters.";

                    return;

                }


                if (password !== confirmPassword) {

                    signupMessage.textContent =
                        "Passwords do not match.";

                    return;

                }


                try {

                    const response =
                        await fetch(
                            "https://placementhub-management-system.onrender.commanagement-system.onrender.commanagement-system.onrender.commanagement-system.onrender.com/api/signup",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    name: name,
                                    email: email,
                                    password: password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        signupMessage.textContent =
                            data.message ||
                            "Signup failed.";

                        return;

                    }


                    signupMessage.textContent =
                        "Account created successfully!";

                    signupMessage.style.color =
                        "#16a34a";


                    signupForm.reset();


                    setTimeout(
                        function () {

                            window.location.href =
                                "index.html";

                        },
                        1200
                    );


                } catch (error) {

                    signupMessage.textContent =
                        "Unable to connect to server.";

                }

            }
        );

    </script>

</body>
</html>
