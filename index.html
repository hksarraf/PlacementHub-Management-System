<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlacementHub - Login</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ================================
           PROFESSIONAL LOGIN PAGE
        ================================= */

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background:
                radial-gradient(circle at 15% 20%, rgba(79, 70, 229, 0.12), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.10), transparent 30%),
                #f8fafc;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 22px;
            padding: 38px 36px;
            box-shadow:
                0 20px 45px rgba(15, 23, 42, 0.08),
                0 4px 12px rgba(15, 23, 42, 0.04);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 14px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #ffffff;
            font-size: 25px;
            font-weight: 800;
            box-shadow: 0 10px 22px rgba(79, 70, 229, 0.25);
        }

        .brand h1 {
            margin: 0;
            color: #111827;
            font-size: 25px;
            font-weight: 750;
            letter-spacing: -0.5px;
        }

        .brand p {
            margin: 6px 0 0;
            color: #6b7280;
            font-size: 13px;
        }

        .login-header {
            margin-bottom: 24px;
        }

        .login-header h2 {
            margin: 0 0 7px;
            color: #111827;
            font-size: 22px;
            font-weight: 700;
        }

        .login-header p {
            margin: 0;
            color: #6b7280;
            font-size: 13.5px;
        }

        .input-group {
            margin-bottom: 19px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-size: 13px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid #dfe3e8;
            border-radius: 10px;
            background: #ffffff;
            color: #111827;
            font-size: 14px;
            outline: none;
            transition: 0.2s ease;
        }

        .input-group input::placeholder {
            color: #9ca3af;
        }

        .input-group input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.10);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 48px;
        }

        .password-box button {
            position: absolute;
            right: 7px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #6b7280;
            cursor: pointer;
            font-size: 16px;
        }

        .password-box button:hover {
            background: #f3f4f6;
        }

        .login-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 2px 0 22px;
            font-size: 12.5px;
        }

        .login-options label {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #6b7280;
            cursor: pointer;
        }

        .login-options input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: #4f46e5;
            cursor: pointer;
        }

        .login-options a,
        .signup-text a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        .login-options a:hover,
        .signup-text a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            height: 47px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #ffffff;
            font-size: 14px;
            font-weight: 650;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(79, 70, 229, 0.20);
            transition: 0.2s ease;
        }

        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 11px 22px rgba(79, 70, 229, 0.26);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        #loginMessage {
            min-height: 18px;
            margin: 12px 0 0;
            text-align: center;
            font-size: 12.5px;
        }

        .signup-text {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eef0f3;
            text-align: center;
            color: #6b7280;
            font-size: 12.5px;
        }

        .signup-text a {
            margin-left: 4px;
        }

        @media (max-width: 500px) {
            .login-container {
                padding: 20px 14px;
            }

            .login-card {
                padding: 30px 24px;
                border-radius: 18px;
            }

            .brand h1 {
                font-size: 23px;
            }

            .login-header h2 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="brand">
                <div class="brand-icon">P</div>

                <h1>PlacementHub</h1>

                <p>Student Placement Management</p>
            </div>

            <div class="login-header">
                <h2>Welcome Back 👋</h2>
                <p>Login to manage your placement journey</p>
            </div>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <div class="password-box">
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button type="button" id="togglePassword">
                            👁
                        </button>
                    </div>
                </div>

                <div class="login-options">

                    <label>
                        <input type="checkbox" id="remember">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <button type="submit" class="login-btn">
                    Login
                </button>

                <p id="loginMessage"></p>

            </form>

            <div class="signup-text">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </div>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>
</html>
